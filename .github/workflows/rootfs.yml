# Arch Linux ARM + Plasma rootfs, initramfs and SSD image on a native arm64 runner (no qemu:
# minutes instead of an hour in WSL). The artifact is public, so it carries nothing private:
# build.sh personalize adds local-overlay (Wi-Fi, SSH) and the ROM's DSP libraries on the PC.
name: rootfs

on:
  workflow_dispatch:
  workflow_run:
    workflows: [kernel]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - build/build.sh
      - build/config.env
      - build/rootfs-files/**
      - build/initcpio/**
      - .github/workflows/rootfs.yml

permissions:
  contents: write   # the rootfs-latest release
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Firmware submodule
        run: git submodule update --init --depth 1 linux-firmware-tb710fu

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts libarchive-tools gdisk e2fsprogs btrfs-progs \
            clang lld python3 xz-utils curl device-tree-compiler
          df -h / "$HOME"

      - name: Kernel, rootfs, SSD image
        run: |
          bash build/build.sh kernel
          bash build/build.sh rootfs
          bash build/build.sh image
          cd "$HOME/tb710fu/out"
          sha256sum tb710fu-ssd.img.xz initramfs.img | tee rootfs-tb710fu.sha256
          df -h /

      - name: Rootfs tarball (for /data/linux, android/install-linux-data.sh)
        run: |
          cd "$HOME/tb710fu/out"
          # no SSD image left on disk needed past this point
          sudo tar -C rootfs --numeric-owner --xattrs --acls -cpf - . | xz -T0 -6 > tb710fu-rootfs.tar.xz
          sha256sum tb710fu-rootfs.tar.xz initramfs.img | tee SHA256SUMS
          ls -l tb710fu-rootfs.tar.xz

      # public, plain-URL downloads: the tablet fetches the tarball itself, build.sh initramfs the
      # 60 MB initramfs. Nothing private is in either (local-overlay/DSP libs come from the PC).
      - name: Release rootfs-latest
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$HOME/tb710fu/out"
          gh release delete rootfs-latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create rootfs-latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease             --title "rootfs (latest CI build)"             --notes "Arch Linux ARM rootfs for /data/linux and the initramfs, from $GITHUB_SHA (run $GITHUB_RUN_ID). Install: android/install-linux-data.sh."             tb710fu-rootfs.tar.xz initramfs.img SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-tb710fu
          path: |
            ~/tb710fu/out/tb710fu-ssd.img.xz
            ~/tb710fu/out/initramfs.img
            ~/tb710fu/out/rootfs-tb710fu.sha256
          compression-level: 0
          retention-days: 14
