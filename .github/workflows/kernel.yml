# Kernel for the slot-b boot: ArmadaOS Freedom's unified kernel (Linux 7.2.6 + its patches and
# TB710FU board support) with this repo's overlay kernel/armada-overlay/tb710fu-locked.
# Built natively on an arm64 runner; build/build.sh kernel downloads the artifact.
name: kernel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - kernel/**
      - .github/workflows/kernel.yml

env:
  # ArmadaOS-Freedom/armadaos-freedom main, 2026-11-17 (build/device-kernel.sh reads this line)
  ARMADA_SHA: 5c4454f23cd72b05267645da4459b7af70e24f03

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves \
            zstd xz-utils cpio patch curl python3 kmod ccache git device-tree-compiler

      - name: ArmadaOS kernel tree + our overlay
        run: |
          git init -q armada
          git -C armada fetch -q --depth 1 https://github.com/ArmadaOS-Freedom/armadaos-freedom.git "$ARMADA_SHA"
          git -C armada checkout -q FETCH_HEAD
          cp -r kernel/armada-overlay/tb710fu-locked armada/packages/kernel/overlays/

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.ARMADA_SHA }}-${{ hashFiles('kernel/**') }}
          restore-keys: ccache-${{ env.ARMADA_SHA }}-

      - name: Build
        working-directory: armada/packages/kernel
        env:
          KERNEL_OVERLAYS: tb710fu-locked
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          WORK_DIR="$RUNNER_TEMP/kb" OUT_DIR="$RUNNER_TEMP/kout" bash scripts/build-kernel.sh

      # what Steam/FEX/gamescope and the tablet's setup rely on: fail here, not on the device
      - name: Check required kernel options
        run: |
          c=$(ls -d "$RUNNER_TEMP"/kb/linux-*/ | head -1).config
          for o in NTSYNC=y ARM64_4K_PAGES=y BINFMT_MISC=m USER_NS=y FUSE_FS=m OVERLAY_FS=m EROFS_FS=m             SQUASHFS=y COMPAT=y UHID=y HIDRAW=y HID_STEAM=m JOYSTICK_XPAD=m HID_PLAYSTATION=m             HID_NINTENDO=m BT_HIDP=m UCLAMP_TASK=y SCHED_CLASS_EXT=y DEBUG_INFO_BTF=y             TRANSPARENT_HUGEPAGE_MADVISE=y LRU_GEN_ENABLED=y INPUT_UINPUT=y ZSWAP=y             ZSWAP_COMPRESSOR_DEFAULT_ZSTD=y CPU_IDLE_GOV_TEO=y REGULATOR_VIRTUAL_CONSUMER=y; do
            grep -qx "CONFIG_$o" "$c" || { echo "missing CONFIG_$o: $(grep "CONFIG_${o%=*}[= ]" "$c")"; exit 1; }
          done
          ! grep -q '^CONFIG_ZSWAP_DEFAULT_ON=y' "$c"
          cp "$c" kernel.config

      # out-of-tree like Armada's own aw882xx; loads only when the DT keyboard node is "okay"
      - name: Keyboard Pack kernel driver (kernel/tb710fu-kbpack)
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/codec-test" kernel/tb710fu-kbpack/codec-test.c
          "$RUNNER_TEMP/codec-test"
          stage=$(ls -d "$RUNNER_TEMP"/kb/staging-*)
          kver=${stage##*/staging-}
          src=$(ls -d "$RUNNER_TEMP"/kb/linux-*/ | head -1)
          make -C "$src" M="$PWD/kernel/tb710fu-kbpack" W=1 KCFLAGS=-Werror modules
          make -C "$src" M="$PWD/kernel/tb710fu-kbpack" INSTALL_MOD_PATH="$stage" \
            INSTALL_MOD_DIR=extra/tb710fu-kbpack INSTALL_MOD_STRIP=1 modules_install
          depmod -b "$stage" "$kver"
          modinfo -b "$stage" -k "$kver" tb710fu-kbpack | grep -E '^(filename|alias|vermagic)'
          dtc -I dtb -O dts "$stage/lib/modules/$kver/dtb/qcom/sm8650-lenovo-tb710fu-locked.dtb" 2>/dev/null |
            grep -A6 'lenovo,tb710fu-keyboard-pack'

      - name: Pack Image, DTBs, modules and Armada's TB710FU rootfs files
        run: |
          stage=$(ls -d "$RUNNER_TEMP"/kb/staging-*)
          kver=${stage##*/staging-}
          echo "kernel release: $kver"
          test -f "$stage/lib/modules/$kver/vmlinuz"
          test -f "$stage/lib/modules/$kver/dtb/qcom/sm8650-lenovo-tb710fu-locked.dtb"
          tar -C "$stage" -czf "kernel-$kver.tar.gz" lib
          # files that go with this kernel's TB710FU drivers (build.sh rootfs extracts them over /)
          x=$(mktemp -d) a=armada
          # ADSP/CDSP/zap images stay this repo's (linux-firmware-tb710fu): proven with USB host + sensors
          mkdir -p "$x/usr/lib/firmware/qcom/sm8650/xiaoxin/gt"
          cp -r $a/devices/lenovo-tb710fu/firmware/novatek "$x/usr/lib/firmware/"
          cp $a/devices/lenovo-tb710fu/firmware/qcom/sm8650/xiaoxin/gt/aw882xx_acf.bin "$x/usr/lib/firmware/qcom/sm8650/xiaoxin/gt/"
          (cd $a/system_files && cp --parents -r \
            usr/lib/firmware/qcom/sm8650/Lenovo-TB710FU-tplg.bin \
            usr/share/alsa/ucm2/Lenovo/TB710FU \
            usr/share/alsa/ucm2/conf.d/sm8650/Lenovo-TB710FU.conf \
            usr/share/wireplumber/wireplumber.conf.d/53-lenovo-tb710fu-speakers.conf "$x/")
          tar -C "$x" --owner=0 --group=0 -czf rootfs-extra.tar.gz .
          tar -tzf rootfs-extra.tar.gz
          sha256sum kernel-*.tar.gz rootfs-extra.tar.gz | tee kernel-tb710fu.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-tb710fu
          path: |
            kernel-*.tar.gz
            rootfs-extra.tar.gz
            kernel-tb710fu.sha256
            kernel.config
          retention-days: 30
